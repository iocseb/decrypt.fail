<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2213%22 font-size=%2214%22>%E2%96%B6</text></svg>">
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <header class="site-header">
    <a class="prompt" href="/">
      <span class="user">seb@decrypt</span><span class="path">:~$</span>
      <span class="cmd">cd /</span><span class="cursor">█</span>
    </a>
    <nav class="site-nav">
      <a href="/">home</a>
      <a href="/whoami/">whoami</a>
      <a href="/tags/">tags</a>
      <a href="https://github.com/iocseb">github ↗</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span>$ built with <a href="https://jekyllrb.com">Jekyll</a> · hosted on <a href="https://pages.github.com">GitHub Pages</a></span>
    <span class="footer-links">
      <a href="https://ioc.exchange/@seb">mastodon</a>
      <a href="https://bsky.app/profile/decrypt.fail">bluesky</a>
      <a href="https://github.com/iocseb">github</a>
    </span>
  </footer>
</body>
</html>
